<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrade Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0e1621;
            --card-bg: #17212b;
            --accent-color: #2ea6ff;
            --text-color: #ffffff;
            --text-muted: #7f91a4;
            --green: #4cd964;
            --red: #ff3b30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .balance-box { text-align: right; }
        .balance-label { font-size: 11px; color: var(--text-muted); }
        .balance-val { font-size: 15px; font-weight: bold; color: var(--green); }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-title { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .signal-header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: rgba(76, 217, 100, 0.15); color: var(--green); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        .timer { font-size: 26px; font-weight: bold; text-align: center; margin: 15px 0 5px 0; font-family: monospace; }
        .timer-label { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px; }

        .btn-trade {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 166, 255, 0.3);
            transition: 0.2s;
        }
        .btn-trade:active { transform: scale(0.98); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-num { font-size: 16px; font-weight: bold; margin-top: 4px; }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- Header Profil & Solde -->
    <div class="header">
        <div class="user-info">
            <div class="avatar" id="user-avatar">A</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;" id="user-name">Membre VIP</div>
                <div style="font-size: 11px; color: var(--text-muted);">Compte Débutant</div>
            </div>
        </div>
        <div class="balance-box">
            <div class="balance-label">SOLDE ACTIF</div>
            <div class="balance-val" id="user-balance">0.00 USDT</div>
        </div>
    </div>

    <!-- Card Signal Copy Trading -->
    <div class="card">
        <div class="signal-header">
            <span class="card-title">SIGNAL DU MOMENT</span>
            <span class="badge" id="signal-status">🟢 ACTIF</span>
        </div>

        <div class="timer" id="countdown">14:59</div>
        <div class="timer-label">Temps restant pour exécuter l'ordre</div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="balance-label">PAIRE</div>
                <div class="stat-num">BTC/USDT</div>
            </div>
            <div class="stat-item">
                <div class="balance-label">SUCCÈS ESTIMÉ</div>
                <div class="stat-num" style="color: var(--green);">94.5%</div>
            </div>
        </div>

        <button class="btn-trade" style="margin-top: 15px;" onclick="tradeExecute()">⚡ EXÉCUTER LE TRADE</button>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div class="nav-item active">
            <div class="nav-icon">📈</div>
            Trading
        </div>
        <div class="nav-item" onclick="alert('Module Portefeuille en cours d\'intégration')">
            <div class="nav-icon">💳</div>
            Dépôt
        </div>
        <div class="nav-item" onclick="alert('Historique bientôt disponible')">
            <div class="nav-icon">📊</div>
            Historique
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let u = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = u.first_name || 'Utilisateur';
            document.getElementById('user-avatar').innerText = (u.first_name || 'A').charAt(0).toUpperCase();
        }

        function tradeExecute() {
            tg.showConfirm("Voulez-vous valider ce signal Copy Trading ?", function(confirmed) {
                if (confirmed) {
                    alert("Trade exécuté avec succès ! Commission enregistrée.");
                }
            });
        }
    </script>
</body>
</html>
