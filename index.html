<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrade Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #242f3d;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }
        .status {
            color: #4cd964;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>📈 ApexTrade Pro</h2>
    <p>Plateforme de Copy Trading en temps réel</p>

    <div class="card">
        <h3>Statut du Signal</h3>
        <p class="status">🟢 Signal Actif (10:00 - 10:15)</p>
        <p>Taux de réussite estimé : <b>92%</b></p>
        <button class="btn" onclick="executeTrade()">⚡ EXÉCUTER LE TRADE</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function executeTrade() {
            alert("Trade exécuté avec succès !");
            tg.sendData("trade_executed");
        }
    </script>
</body>
</html>
